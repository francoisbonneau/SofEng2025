# ETAPE 7 (BONUS) : verifier le formatage du code
# NOUVEAU fichier, a cote de ci.yml et cd.yml.
# clang-format lit les regles dans .clang-format et echoue (--Werror)
# si un fichier n'est pas formate. Il ne modifie RIEN (--dry-run).
#
# Pour corriger en local :
#   clang-format -i mains/*.cpp src/basic/*.cpp include/basic/*.h tests/*.cpp
name: Format

on:
  push:
    branches: [master]
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Verifier le formatage
        run: clang-format --dry-run --Werror mains/*.cpp src/basic/*.cpp include/basic/*.h tests/*.cpp
